# ローカル再現: チューニング版 nginx (EC2の tuning/nginx-isucon.conf を Docker向けに調整)
#   Step3: /image FS静的配信 / Step7: 静的アセット直配信+gzip+upstream keepalive
#   Step13: /posts proxy_cache / Step15: 匿名GET/ proxy_cache(Cookie有はbypass)
# 配置先: /etc/nginx/conf.d/isu.conf (http コンテキストに include される)

upstream app {
  server app:8080;
  keepalive 64;                 # Step7: Goへの接続をHTTP/1.1で再利用
}

# Step7: 静的ファイルのopen_file_cache
open_file_cache max=10000 inactive=60s;
open_file_cache_valid 60s;
open_file_cache_min_uses 1;
open_file_cache_errors off;

# Step13: /posts?max_created_at= の proxy_cache(不変データ)
proxy_cache_path /var/cache/nginx/posts levels=1:2 keys_zone=posts_cache:10m max_size=500m inactive=24h use_temp_path=off;
# Step15: 匿名GET/ の proxy_cache
proxy_cache_path /var/cache/nginx/index levels=1:2 keys_zone=index_cache:10m max_size=100m inactive=120s use_temp_path=off;

server {
  listen 80;

  client_max_body_size 10m;
  root /public/;

  # Step7: gzip(テキスト系のみ)
  gzip on;
  gzip_types text/css application/javascript application/json text/plain;
  gzip_min_length 1024;
  gzip_vary on;

  # Step7: 静的アセットは nginx 直配信。無ければ @app へフォールバック。
  location ~* \.(css|js|ico|gif|png|jpg|jpeg|svg|woff2?)$ {
    expires 1d;
    access_log off;
    try_files $uri @app;
  }

  # Step3: 投稿画像のFS静的配信(無ければGoが生成して返す)
  location /image/ {
    expires 1d;
    try_files $uri @app;
  }

  # Step15: 匿名(未ログイン)GET / の proxy_cache。Cookie有はbypassでGoへ。
  location = / {
    set $bypass 0;
    if ($http_cookie ~* "isuconp-go\.session") { set $bypass 1; }
    proxy_cache index_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 60s;
    proxy_cache_bypass $bypass;
    proxy_no_cache $bypass;
    proxy_cache_lock on;
    proxy_ignore_headers Cache-Control Expires;
    add_header X-Cache $upstream_cache_status;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://app;
  }

  # Step13: /posts の proxy_cache
  location = /posts {
    proxy_cache posts_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 24h;
    proxy_cache_lock on;
    proxy_ignore_headers Set-Cookie Cache-Control Expires;
    add_header X-Cache $upstream_cache_status;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://app;
  }

  location @app {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://app;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://app;
  }
}
