# ローカル: Ruby チューニング版 nginx。
#   Step3: /image FS静的配信(無ければRubyへ) / Step7: 静的アセット直配信+keepalive / C4: gzip off
#   注: proxy_cache(Step13/15)はRubyのセッションcookie名差異+CSRF懸念のため不採用(安全側)。
upstream app {
  server app:8080;
  keepalive 64;
}

open_file_cache max=10000 inactive=60s;
open_file_cache_valid 60s;
open_file_cache_min_uses 1;
open_file_cache_errors off;

server {
  listen 80;
  client_max_body_size 10m;
  root /public/;

  gzip off;   # C4: nginx最ホット→gzip CPU削減。localhost配信ではバイト増デメリット小。

  # 静的アセットは nginx 直配信。無ければ @app(Ruby) へ。
  location ~* \.(css|js|ico|gif|png|jpg|jpeg|svg|woff2?)$ {
    expires 1d;
    access_log off;
    try_files $uri @app;
  }

  # 投稿画像のFS静的配信(無ければRubyがDBから返す)
  location /image/ {
    expires 1d;
    try_files $uri @app;
  }

  location @app {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://app;
  }
  location / {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://app;
  }
}
