# --- Step7b: nginx FD/接続上限（"Too many open files"でスコア崩落したため） ---
# /etc/nginx/nginx.conf (main):   worker_rlimit_nofile 65535;
# /etc/nginx/nginx.conf (events): worker_connections 8192;   （既定768から）
# /etc/systemd/system/nginx.service.d/limits.conf: [Service]\nLimitNOFILE=65535
#   → daemon-reload + nginx restart（reloadではFD上限が反映されない）。
# 適用スクリプト: tuning/STEP7b_nginx_fd.sh
