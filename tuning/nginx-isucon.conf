# EC2サーバの nginx 設定の記録（再現用）。実体は以下に配置されている:
#   /etc/nginx/sites-available/isucon.conf  (server block)
#   /etc/nginx/conf.d/ltsv_log.conf         (LTSVログ形式; alp等での解析用)
#
# Step3: /image を try_files で nginx 静的配信（無ければ @app=Goへフォールバック）+ expires 1d
# 計測解析用に access_log を LTSV 形式で /var/log/nginx/access_ltsv.log に出力。

# --- /etc/nginx/sites-available/isucon.conf ---
server {
  listen 80;

  client_max_body_size 10m;
  root /home/isucon/private_isu/webapp/public/;
  access_log /var/log/nginx/access_ltsv.log ltsv;

  location /image/ {
    try_files $uri @app;
    expires 1d;
  }
  location @app {
    proxy_set_header Host $host;
    proxy_pass http://localhost:8080;
  }
  location / {
    proxy_set_header Host $host;
    proxy_pass http://localhost:8080;
  }
}

# --- /etc/nginx/conf.d/ltsv_log.conf ---
# log_format ltsv "time:$time_iso8601\tstatus:$status\tsize:$body_bytes_sent\treqtime:$request_time\tuptime:$upstream_response_time\tmethod:$request_method\turi:$uri";
