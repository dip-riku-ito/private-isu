# EC2サーバの nginx 設定の記録（再現用）。実体は以下に配置されている:
#   /etc/nginx/sites-available/isucon.conf  (server block)
#   /etc/nginx/conf.d/ltsv_log.conf         (LTSVログ形式; alp等での解析用)
#   /etc/nginx/conf.d/tuning.conf           (Step7: http-level チューニング)
#
# Step3: /image を try_files で nginx 静的配信（無ければ @app=Goへフォールバック）+ expires 1d
# Step7: 静的アセット(css/js/favicon等)を nginx 直配信 + expires(304で+1点) / gzip / upstream keepalive(HTTP/1.1)
# 計測解析用に access_log を LTSV 形式で /var/log/nginx/access_ltsv.log に出力。

# --- /etc/nginx/sites-available/isucon.conf ---
upstream app {
  server 127.0.0.1:8080;
  keepalive 64;                 # Step7: Goへの接続をHTTP/1.1で再利用（毎回TCP接続を排除）
}

server {
  listen 80;

  client_max_body_size 10m;
  root /home/isucon/private_isu/webapp/public/;
  access_log /var/log/nginx/access_ltsv.log ltsv;

  # Step7: gzip（テキスト系のみ。画像は非圧縮で素通し）
  gzip on;
  gzip_types text/css application/javascript application/json text/plain;
  gzip_min_length 1024;
  gzip_vary on;

  # Step7: 静的アセットは nginx 直配信（Goを介さない）。expiresでベンチに304を誘発し+1点。
  #        ディスクに無ければ @app(Go) へフォールバック。
  location ~* \.(css|js|ico|gif|png|jpg|jpeg|svg|woff2?)$ {
    expires 1d;
    access_log off;
    try_files $uri @app;
  }

  # Step3: 投稿画像のFS静的配信（無ければGoが生成して返す）
  location /image/ {
    expires 1d;
    try_files $uri @app;
  }

  location @app {
    proxy_http_version 1.1;     # Step7: upstream keepalive 有効化のため
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://app;
  }
  location / {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass http://app;
  }
}

